<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>CompassMap - Editar Cliente</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<div class="form-container">
    <h1>✏️ Modificar Ficha de Cliente</h1>
    <p>Edita los campos necesarios. Al guardar, el archivador actualizará los datos sobre el mismo registro sin duplicarlo.</p>

    <!-- Reutilizamos la ruta de guardado. Como la ficha incluye el ID oculto, JPA sabe que debe actualizar en vez de crear -->
    <form th:action="@{/customers/save}" th:object="${clienteAEditar}" method="POST">

        <!-- Campo oculto para conservar el ID único original del cliente sin que se modifique -->
        <input type="hidden" th:field="*{id}" />

        <label>Nombre:</label>
        <input type="text" th:field="*{firstName}" required />

        <label>Apellido:</label>
        <input type="text" th:field="*{lastName}" required />

        <label>Correo Electrónico:</label>
        <input type="email" th:field="*{email}" required />

        <label>Teléfono:</label>
        <input type="text" th:field="*{phone}" />

        <label>Dirección Postal:</label>
        <input type="text" th:field="*{address}" />

        <button type="submit" class="btn-save">💾 Guardar Cambios Realizados</button>
        <a href="/customers" class="btn-cancel">❌ Cancelar y Volver Atrás</a>
    </form>
</div>

</body>
</html>
